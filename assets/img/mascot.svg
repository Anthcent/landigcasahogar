<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a86f"/>
      <stop offset="100%" stop-color="#d6945c"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eceef0"/>
      <stop offset="100%" stop-color="#cfd3d8"/>
    </linearGradient>
  </defs>

  <!-- hair back -->
  <path d="M60 90 Q58 34 120 28 Q182 34 180 90 L172 130 L68 130 Z" fill="#161312"/>

  <!-- neck -->
  <rect x="104" y="112" width="32" height="26" fill="url(#skin)"/>

  <!-- face -->
  <path d="M70 86 Q70 40 120 40 Q170 40 170 86 Q170 128 120 132 Q70 128 70 86 Z" fill="url(#skin)"/>

  <!-- hair front -->
  <path d="M64 92 Q58 40 120 30 Q184 40 178 92 Q168 56 140 52 Q150 70 140 82 Q132 58 108 56 Q116 72 100 82 Q96 60 76 60 Q70 74 76 92 Z" fill="#161312"/>

  <!-- eyes -->
  <circle cx="100" cy="92" r="4.5" fill="#1a1402"/>
  <circle cx="140" cy="92" r="4.5" fill="#1a1402"/>
  <!-- smile -->
  <path d="M104 110 Q120 120 136 110" stroke="#1a1402" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- hoodie body -->
  <path d="M46 260 Q40 170 70 146 Q96 130 120 130 Q144 130 170 146 Q200 170 194 260 Z" fill="url(#hoodie)"/>
  <path d="M88 150 Q120 172 152 150 L160 178 Q120 200 80 178 Z" fill="#9aa0a7"/>

  <!-- backpack straps -->
  <path d="M86 150 L74 240" stroke="#e8973a" stroke-width="16" stroke-linecap="round"/>
  <path d="M154 150 L166 240" stroke="#e8973a" stroke-width="16" stroke-linecap="round"/>

  <!-- crossed arms -->
  <path d="M60 220 Q100 196 120 210 Q100 236 58 236 Z" fill="#e2e5e8"/>
  <path d="M180 220 Q140 196 120 210 Q140 236 182 236 Z" fill="#e2e5e8"/>
</svg>
